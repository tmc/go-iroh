services:
  parity:
    build:
      context: .
      dockerfile: images/parity/Dockerfile
      args:
        RUST_IMAGE: go-iroh-compat:iroh-${IROH_VERSION:?set IROH_VERSION}
        IROH_CUSTOM_COMMIT: ${IROH_CUSTOM_COMMIT}
    environment:
      IROH_VERSION: ${IROH_VERSION:-1.0.3}
      RUST_DOCTOR_BIN: /usr/local/bin/iroh-doctor
      RUST_VECTOR_BIN: /usr/local/bin/rust-driver
      RUST_CUSTOM_VECTOR_BIN: /usr/local/bin/rust-driver-custom
      RUST_DNS_BIN: /usr/local/bin/iroh-dns-server
    volumes:
      - ..:/work
      # A linked worktree's .git file points outside /work. Mount the common
      # directory at its original path so provenance resolves inside Docker.
      - ${GO_IROH_GIT_COMMON_DIR:?set GO_IROH_GIT_COMMON_DIR}:${GO_IROH_GIT_COMMON_DIR}:ro
      # The runner compiles the Go peers on every run. Both caches are keyed by
      # content, so a hit is work Go proved it could skip, not a stale result.
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    command: ["make", "parity-native"]

volumes:
  gomodcache:
  gobuildcache:
