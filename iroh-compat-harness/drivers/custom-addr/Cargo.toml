[package]
name = "go-iroh-custom-addr"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
data-encoding = "2"
iroh-base = { version = "=1.2.0", default-features = false, features = ["key", "relay"] }
iroh-tickets = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
