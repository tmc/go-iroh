[package]
name = "go-iroh-compat-rust-driver"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
data-encoding = "2"
iroh-base = { version = "=1.0.3", default-features = false, features = ["key", "relay"] }
iroh-dns = "=1.0.3"
iroh-tickets = "=1.0.0"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple-dns = "0.11"
