[package]
name = "go-iroh-compat-rust-driver"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
data-encoding = "2"
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "=1.0.3", default-features = false, features = ["key", "relay"] }
iroh-dns = "=1.0.3"
iroh-relay = { version = "=1.0.3", features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple-dns = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
