name: parity nightly

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        iroh: [1.0.0, 1.0.3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: iroh-compat-harness
          file: iroh-compat-harness/images/iroh-${{ matrix.iroh }}/Dockerfile
          load: true
          tags: go-iroh-compat:iroh-${{ matrix.iroh }}
          cache-from: type=gha,scope=iroh-${{ matrix.iroh }}
          cache-to: type=gha,mode=max,scope=iroh-${{ matrix.iroh }}
      - name: Extract upstream binary
        run: |
          cid=$(docker create go-iroh-compat:iroh-${{ matrix.iroh }})
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp "$cid:/usr/local/bin/iroh-doctor" "$RUNNER_TEMP/iroh-doctor"
          docker cp "$cid:/usr/local/bin/iroh-relay" "$RUNNER_TEMP/iroh-relay"
          docker cp "$cid:/usr/local/bin/iroh-dns-server" "$RUNNER_TEMP/iroh-dns-server"
          chmod +x "$RUNNER_TEMP/iroh-doctor" "$RUNNER_TEMP/iroh-relay" "$RUNNER_TEMP/iroh-dns-server"
      - name: Run full declared matrix
        working-directory: iroh-compat-harness
        env:
          RUST_DOCTOR_BIN: ${{ runner.temp }}/iroh-doctor
          RUST_RELAY_BIN: ${{ runner.temp }}/iroh-relay
          RUST_DNS_BIN: ${{ runner.temp }}/iroh-dns-server
          RUST_VECTOR_BIN: ${{ github.workspace }}/iroh-compat-harness/drivers/rust-driver/target/release/go-iroh-compat-rust-driver
        run: |
          cargo build --quiet --release --locked --manifest-path drivers/rust-driver/Cargo.toml
          make parity-native IROH_VERSION=${{ matrix.iroh }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-iroh-${{ matrix.iroh }}
          path: |
            iroh-compat-harness/results/
            COMPATIBILITY.md

  publish:
    needs: parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: parity-iroh-*
          path: ${{ runner.temp }}/nightly
      - name: Refresh compatibility page
        run: |
          cp "$RUNNER_TEMP/nightly/parity-iroh-1.0.3/COMPATIBILITY.md" COMPATIBILITY.md
          cp "$RUNNER_TEMP/nightly/parity-iroh-1.0.3/iroh-compat-harness/results/badge.json" iroh-compat-harness/results/badge.json
          cp "$RUNNER_TEMP/nightly/parity-iroh-1.0.3/iroh-compat-harness/results/results.json" iroh-compat-harness/results/results.json
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add COMPATIBILITY.md iroh-compat-harness/results
          git commit -m 'compat: refresh parity results'
          git push
