name: parity

on:
  pull_request:
  push:
    branches: [compat-harness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            iroh-compat-harness/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: iroh-compat-harness
          file: iroh-compat-harness/images/iroh-1.0.3/Dockerfile
          load: true
          tags: go-iroh-compat:iroh-1.0.3
          cache-from: type=gha,scope=iroh-1.0.3
          cache-to: type=gha,mode=max,scope=iroh-1.0.3
      - name: Extract upstream binary
        run: |
          cid=$(docker create go-iroh-compat:iroh-1.0.3)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp "$cid:/usr/local/bin/iroh-doctor" "$RUNNER_TEMP/iroh-doctor"
          docker cp "$cid:/usr/local/bin/iroh-relay" "$RUNNER_TEMP/iroh-relay"
          chmod +x "$RUNNER_TEMP/iroh-doctor" "$RUNNER_TEMP/iroh-relay"
      - name: Run parity matrix
        working-directory: iroh-compat-harness
        env:
          RUST_DOCTOR_BIN: ${{ runner.temp }}/iroh-doctor
          RUST_RELAY_BIN: ${{ runner.temp }}/iroh-relay
          RUST_VECTOR_BIN: ${{ github.workspace }}/iroh-compat-harness/drivers/rust-driver/target/release/go-iroh-compat-rust-driver
        run: |
          cargo build --quiet --release --locked --manifest-path drivers/rust-driver/Cargo.toml
          make parity-native IROH_VERSION=1.0.3
      - uses: actions/upload-artifact@v4
        with:
          name: parity-iroh-1.0.3
          path: |
            iroh-compat-harness/results/results.json
            iroh-compat-harness/results/badge.json
            COMPATIBILITY.md
