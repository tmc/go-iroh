name: upstream drift canary

on:
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: n0-computer/iroh
          path: iroh-compat-harness/upstream-iroh
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare vectors with upstream main
        id: drift
        continue-on-error: true
        working-directory: iroh-compat-harness
        run: |
          cp drivers/rust-driver/Cargo.toml "$RUNNER_TEMP/Cargo.toml"
          cp -R drivers/rust-driver/src "$RUNNER_TEMP/src"
          cat >>"$RUNNER_TEMP/Cargo.toml" <<EOF
          [patch.crates-io]
          iroh-base = { path = "$GITHUB_WORKSPACE/iroh-compat-harness/upstream-iroh/iroh-base" }
          iroh-dns = { path = "$GITHUB_WORKSPACE/iroh-compat-harness/upstream-iroh/iroh-dns" }
          iroh-relay = { path = "$GITHUB_WORKSPACE/iroh-compat-harness/upstream-iroh/iroh-relay" }
          EOF
          cargo run --quiet --release --manifest-path "$RUNNER_TEMP/Cargo.toml" >"$RUNNER_TEMP/corpus.json"
          cmp vectors/corpus.json "$RUNNER_TEMP/corpus.json"
      - name: Open local drift issue
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="iroh main compatibility drift $(date -u +%F)"
          if ! gh issue list --state open --search "$title in:title" --json title --jq 'length > 0' | grep -q true; then
            gh issue create --title "$title" --body "The nightly L0 corpus diverged from n0-computer/iroh main. See run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          exit 1
